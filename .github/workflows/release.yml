name: Build and Release (Windows, macOS, Linux)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/1.3.290.0/windows/VulkanSDK-1.3.290.0-Installer.exe" -OutFile VulkanSDK.exe
          Start-Process -FilePath VulkanSDK.exe -ArgumentList "/S" -Wait
          echo "VULKAN_SDK=C:\VulkanSDK\1.3.290.0" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\1.3.290.0\Bin" >> $env:GITHUB_PATH

      - name: Install Vulkan SDK and dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt update
          # Install only the essential Vulkan packages, skip problematic crashdiagnosticlayer
          sudo apt install -y \
            vulkan-headers \
            vulkan-validationlayers \
            vulkan-validationlayers-dev \
            spirv-tools \
            glslang-tools \
            libvulkan-dev \
            libxinerama-dev \
            libxcursor-dev \
            xorg-dev \
            libglu1-mesa-dev \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libx11-xcb-dev \
            libxkbcommon-dev

      - name: Install Vulkan SDK (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja molten-vk vulkan-headers vulkan-loader glslang

          # Set up environment variables
          echo "VULKAN_SDK=$(brew --prefix molten-vk)" >> $GITHUB_ENV
          echo "VK_ICD_FILENAMES=$(brew --prefix molten-vk)/share/vulkan/icd.d/MoltenVK_icd.json" >> $GITHUB_ENV

          # Add glslc to PATH
          GLSLANG_PREFIX=$(brew --prefix glslang)
          echo "$GLSLANG_PREFIX/bin" >> $GITHUB_PATH

          # Create symlink if glslc doesn't exist but glslangValidator does
          if [ ! -f "$GLSLANG_PREFIX/bin/glslc" ] && [ -f "$GLSLANG_PREFIX/bin/glslangValidator" ]; then
            mkdir -p ~/bin
            ln -s "$GLSLANG_PREFIX/bin/glslangValidator" ~/bin/glslc
            echo "$HOME/bin" >> $GITHUB_PATH
          fi

      - name: Verify Vulkan tools (all platforms)
        shell: bash
        run: |
          echo "VULKAN_SDK: $VULKAN_SDK"
          echo "PATH: $PATH"

          echo "Checking for glslc..."
          which glslc || echo "glslc not found"
          glslc --version || echo "glslc not executable"

          echo "Checking for glslangValidator..."
          which glslangValidator || echo "glslangValidator not found"
          glslangValidator --version || echo "glslangValidator not executable"

      - name: Setup MSVC (Windows only)
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake (with glslangValidator fallback on macOS)
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # Try to find glslc or use glslangValidator
            GLSLC_PATH=$(which glslc 2>/dev/null || which glslangValidator 2>/dev/null || echo "")
            if [ -n "$GLSLC_PATH" ]; then
              cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DGLSLC=$GLSLC_PATH
            else
              cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
            fi
          else
            cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release

      - name: Package executables and shaders
        shell: bash
        run: |
          mkdir -p package

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp build/Release/vulkan_cube.exe package/ || cp build/vulkan_cube.exe package/
            cp -r build/shaders package/ 2>/dev/null || cp -r build/Release/shaders package/ 2>/dev/null || true
          else
            cp build/vulkan_cube package/
            cp -r build/shaders package/ 2>/dev/null || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-cube-${{ matrix.os }}
          path: package/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create per-platform ZIPs
        run: |
          mkdir -p release-zips

          # Windows
          cd artifacts/vulkan-cube-windows-latest
          zip -r ../../release-zips/vulkan-cube-windows.zip *
          cd ../..

          # Linux
          cd artifacts/vulkan-cube-ubuntu-latest
          chmod +x vulkan_cube
          zip -r ../../release-zips/vulkan-cube-linux.zip *
          cd ../..

          # macOS
          cd artifacts/vulkan-cube-macos-latest
          chmod +x vulkan_cube
          zip -r ../../release-zips/vulkan-cube-macos.zip *
          cd ../..

      - name: Semantic Version Tagging (only on qualifying commits)
        id: tag
        uses: paulhatch/semantic-version@v5.4.0
        with:
          major_pattern: "(BREAKING CHANGE|breaking)"
          minor_pattern: "feat:"
          version_format: "v${major}.${minor}.${patch}"
          namespace: ""
          bump_each_commit: false
          search_commit_body: true

      - name: Create Release with platform ZIPs (only if new version)
        if: steps.tag.outputs.version_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version_tag }}
          name: Vulkan Cube ${{ steps.tag.outputs.version_tag }}
          body: |
            ## Installation

            ### Windows
            1. Download `vulkan-cube-windows.zip`
            2. Extract and run `vulkan_cube.exe`
            3. Requires Vulkan-compatible GPU and drivers

            ### Linux
            1. Download `vulkan-cube-linux.zip`
            2. Extract and run `./vulkan_cube`
            3. Install Vulkan drivers: `sudo apt install vulkan-tools libvulkan1`

            ### macOS
            1. Download `vulkan-cube-macos.zip`
            2. Extract and run `./vulkan_cube`
            3. Requires MoltenVK (included via Homebrew: `brew install molten-vk`)

            **Note**: Compiled SPIR-V shaders are included in the `shaders/` directory.
          generate_release_notes: true
          files: |
            release-zips/vulkan-cube-windows.zip
            release-zips/vulkan-cube-linux.zip
            release-zips/vulkan-cube-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
