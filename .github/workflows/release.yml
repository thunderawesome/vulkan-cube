name: Build and Release (Windows, macOS, Linux)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          # Fetch the latest Windows SDK version string (e.g., 1.4.335.0)
          $latestVersion = Invoke-RestMethod -Uri "https://vulkan.lunarg.com/sdk/latest/windows.txt"

          # Construct the direct download URL for the installer
          $downloadUrl = "https://sdk.lunarg.com/sdk/download/$latestVersion/windows/VulkanSDK-$latestVersion-Installer.exe"

          # Download the installer
          Invoke-WebRequest -Uri $downloadUrl -OutFile VulkanSDK.exe

          # Silent install
          Start-Process -FilePath VulkanSDK.exe -ArgumentList "/S" -Wait

          # Dynamically find the installed SDK directory (latest version folder)
          $sdkPath = Get-ChildItem -Path "C:\VulkanSDK\" -Directory | Sort-Object Name -Descending | Select-Object -First 1 | Select-Object -ExpandProperty FullName

          # Set environment variables
          echo "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\Bin" >> $env:GITHUB_PATH

      - name: Install Vulkan SDK and dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt update
          sudo apt install -y \
            vulkan-headers \
            vulkan-validationlayers \
            vulkan-validationlayers-dev \
            spirv-tools \
            glslang-tools \
            libvulkan-dev \
            libxinerama-dev \
            libxcursor-dev \
            xorg-dev \
            libglu1-mesa-dev \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libx11-xcb-dev \
            libxkbcommon-dev

      - name: Install Vulkan SDK (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja molten-vk vulkan-headers vulkan-loader glslang
          # Set up MoltenVK environment variables (stable and widely supported)
          echo "VULKAN_SDK=$(brew --prefix molten-vk)" >> $GITHUB_ENV
          echo "VK_ICD_FILENAMES=$(brew --prefix molten-vk)/share/vulkan/icd.d/MoltenVK_icd.json" >> $GITHUB_ENV
          # Add glslang tools to PATH
          echo "$(brew --prefix glslang)/bin" >> $GITHUB_PATH

      - name: Verify Vulkan and shader tools
        shell: bash
        run: |
          echo "VULKAN_SDK: $VULKAN_SDK"
          echo "VK_ICD_FILENAMES: $VK_ICD_FILENAMES"
          echo "PATH: $PATH"
          echo "=== Checking glslc ==="
          which glslc && glslc --version || echo "glslc not found"
          echo "=== Checking glslangValidator ==="
          which glslangValidator && glslangValidator --version || echo "glslangValidator not found"

      - name: Setup MSVC (Windows only)
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package executables and shaders
        shell: bash
        run: |
          mkdir -p package
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp build/Release/vulkan_cube.exe package/ || cp build/vulkan_cube.exe package/
            cp -r build/shaders package/ 2>/dev/null || cp -r build/Release/shaders package/ 2>/dev/null || true
          else
            cp build/vulkan_cube package/
            cp -r build/shaders package/ 2>/dev/null || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-cube-${{ matrix.os }}
          path: package/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only run release job on tagged commits to avoid unnecessary releases on every push
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create per-platform ZIPs
        run: |
          mkdir -p release-zips
          # Windows
          cd artifacts/vulkan-cube-windows-latest
          zip -r ../../release-zips/vulkan-cube-windows.zip *
          cd ../..
          # Linux
          cd artifacts/vulkan-cube-ubuntu-latest
          chmod +x vulkan_cube
          zip -r ../../release-zips/vulkan-cube-linux.zip *
          cd ../..
          # macOS
          cd artifacts/vulkan-cube-macos-latest
          chmod +x vulkan_cube
          zip -r ../../release-zips/vulkan-cube-macos.zip *
          cd ../..

      - name: Semantic Version Tagging
        id: tag
        uses: paulhatch/semantic-version@v5.4.0
        with:
          major_pattern: "(BREAKING CHANGE|breaking)"
          minor_pattern: "feat:"
          version_format: "v${major}.${minor}.${patch}"
          namespace: ""
          bump_each_commit: false
          search_commit_body: true

      - name: Create Release with platform ZIPs (only if new version)
        if: steps.tag.outputs.version_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version_tag }}
          name: Vulkan Cube ${{ steps.tag.outputs.version_tag }}
          body: |
            ## Installation

            ### Windows
            1. Download `vulkan-cube-windows.zip`
            2. Extract and run `vulkan_cube.exe`
            3. Requires Vulkan-compatible GPU and drivers

            ### Linux
            1. Download `vulkan-cube-linux.zip`
            2. Extract and run `./vulkan_cube`
            3. Install Vulkan drivers: `sudo apt install vulkan-tools libvulkan1`

            ### macOS
            1. Download `vulkan-cube-macos.zip`
            2. Extract and run `./vulkan_cube`
            3. Requires MoltenVK (install via Homebrew: `brew install molten-vk` if needed)

            **Note**: Compiled SPIR-V shaders are included in the `shaders/` directory.
          generate_release_notes: true
          files: |
            release-zips/vulkan-cube-windows.zip
            release-zips/vulkan-cube-linux.zip
            release-zips/vulkan-cube-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
